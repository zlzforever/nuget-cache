name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Login docker regsitry
      run: docker login -u ${{ secrets.DOCKER_USER }} -p  ${{ secrets.DOCKER_PASSWORD }}
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
          docker build . --file Dockerfile --tag zlzforever/orbitra:202600416.2
          docker build . --file Dockerfile --tag zlzforever/orbitra 
    - name: Publish the Docker image
      run: |
          docker push zlzforever/orbitra:202600416.2
          docker push zlzforever/orbitra
